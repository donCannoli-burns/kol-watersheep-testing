name: test

on:
  push:
  pull_request:

jobs:
  mock-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: bash -n run-kol-mock-lab
      - run: npm test
      - run: npm run smoke

  foundry-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash -n run-kol-foundry
      - run: PYTHONPATH=foundry/src python -m unittest discover -s foundry/tests -v
